<script>
window.SiteApp = window.SiteApp || {};
window.SiteApp.initSkipNav = function () {
  const skipLink = document.querySelector("#skip-link");
  if (skipLink) {
    skipLink.addEventListener("click", function (e) {
      e.preventDefault();
      const target = document.querySelector("#block-after-navigation");
      if (target) {
        target.setAttribute("tabindex", "-1");
        target.focus();
      }
    });
  }
};
</script>
