<script>
window.SiteApp = window.SiteApp || {};
window.SiteApp.initCore = function () {
  // 1. Focus-visible Polyfill
  document.documentElement.classList.add('js-focus-visible');
  let isKeyboardEvent = false;

  document.addEventListener('keydown', (e) => {
    if (e.metaKey || e.altKey || e.ctrlKey) return;
    isKeyboardEvent = true;
  }, true);

  document.addEventListener('mousedown', () => { isKeyboardEvent = false; }, true);
  document.addEventListener('pointerdown', () => { isKeyboardEvent = false; }, true);
  document.addEventListener('touchstart', () => { isKeyboardEvent = false; }, true);

  document.addEventListener('focus', (e) => {
    if (isKeyboardEvent && e.target && e.target.classList && e.target.classList.add) {
      e.target.classList.add('focus-visible');
    }
  }, true);

  document.addEventListener('blur', (e) => {
    if (e.target && e.target.classList && e.target.classList.remove) {
      e.target.classList.remove('focus-visible');
    }
  }, true);

  // 2. Keyboard Accessibility (Enter / Space mapping to clicks)
  window.addEventListener("keydown", (e) => {
    const isEnter = e.key === "Enter" || e.keyCode === 13;
    const isSpace = e.code === "Space" || e.keyCode === 32;
    const ignoredTags = ["INPUT", "TEXTAREA", "SELECT"];
    
    if (!ignoredTags.includes(e.target.tagName) && (isEnter || isSpace)) {
      e.target.click();
      e.preventDefault();
    }
  });

  // 3. Scroll Animations (Intersection Observer logic)
  function initScrollAnimations() {
    const animationItems = document.querySelectorAll('[data-a-type]:not([data-a-state])');
    
    const observer = new IntersectionObserver((entries, obs) => {
      entries.forEach((entry) => {
        if (entry.isIntersecting) {
          const target = entry.target;
          const type = target.getAttribute('data-a-type') || 'slide-in-from-bottom';
          const timing = target.getAttribute('data-a-timing-function') || 'ease';
          const duration = Number(target.getAttribute('data-a-duration')) || 800;
          const delay = Number(target.getAttribute('data-a-delay')) || 0;
          
          target.setAttribute('data-a-old', target.style.animation || "");
          target.style.animationTimingFunction = timing;
          target.style.animationDuration = `${duration}ms`;
          
          target.setAttribute('data-a-state', 'waiting');
          
          setTimeout(() => {
            target.setAttribute('data-a-state', 'running');
            
            target.addEventListener('animationend', function handler(e) {
              if(e.target === target) {
                target.setAttribute('data-a-state', 'finished');
                target.style.animation = target.getAttribute('data-a-old') || "";
                target.removeAttribute('data-a-old');
                target.removeEventListener('animationend', handler);
              }
            }, { once: true });
          }, delay);
          
          obs.unobserve(target);
        }
      });
    }, {
      root: null,
      rootMargin: '0px', 
      threshold: 0.1 
    });

    animationItems.forEach(item => {
      if (!item.getAttribute('data-a-type')) item.setAttribute('data-a-type', 'slide-in-from-bottom');
      item.setAttribute('data-a-state', 'initialized');
      
      const offset = item.getAttribute('data-a-offset');
      if (offset) {
        const customObserver = new IntersectionObserver((entries) => {
          if (entries[0].isIntersecting) observer.takeRecords();
        }, { rootMargin: offset, threshold: 0.1 });
        customObserver.observe(item);
      } else {
        observer.observe(item);
      }
    });
  }

  initScrollAnimations();

  window.addEventListener("customFilesLoad", () => {
    initScrollAnimations();
  });
};
</script>
