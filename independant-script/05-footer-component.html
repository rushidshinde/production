<script>
window.SiteApp = window.SiteApp || {};
window.SiteApp.initFooter = function () {
  const ACCORDION_CONSTANTS = {
    INSTANCE_LEN: 4,
    KEYS: {
      IS_SINGLE: "isSingle",
      IS_OPEN: "isOpen",
      PREVIOUS_WIDTH: "previousWidth",
      PARENT_ITEM_ID: "parentItemId",
      ITEM_ID: "itemId",
      GROUP_ID: "groupId",
      ITEMS_IDS: "itemsIds",
      SUMMARY_ELEMENT: "summaryElement",
      DETAILS_ELEMENT: "detailsElement"
    },
    MODE: { MANUAL: "manual", BREAKPOINT: "breakpoint" },
    ATTR: { IS_SINGLE: "data-accordion-is-single" }
  };

  function Accordion(options = {}) {
    const {
      openClass = "js--open",
      parentElement = document,
      groupSelector = '[data-role="accordion-group"]',
      itemSelector = '[data-role="accordion"]',
      summarySelector = '[data-role="accordion-summary"]',
      detailsSelector = '[data-role="accordion-details"]',
      breakpoint = window.matchMedia("screen"),
      isSingle = false
    } = options;

    this.instanceId = undefined;
    this.openClass = openClass;
    this.groupSelector = groupSelector;
    this.itemSelector = itemSelector;
    this.summarySelector = summarySelector;
    this.detailsSelector = detailsSelector;
    this.isSingle = isSingle;
    this.breakpoint = breakpoint;
    this.parentElement = parentElement;
    this.groupElements = [];
    this.itemElements = [];
    this.isDestroyed = true;
    this.destroyedBy = undefined;

    const prop = "_accordion";
    const K = ACCORDION_CONSTANTS.KEYS;
    const self = this;

    this.updateInstanceId = function () {
      self.instanceId = Accordion.generateInstanceId();
    };

    this.generateGroupId = function (t) { return `accordion-group-${self.instanceId}-${t}`; };
    this.generateItemId = function (t) { return `accordion-${self.instanceId}-${t}`; };
    this.generateSummaryId = function (t) { return `accordion-summary-${self.instanceId}-${t}`; };
    this.generateDetailsId = function (t) { return `accordion-details-${self.instanceId}-${t}`; };

    this.getItemById = function (t) {
      return self.itemElements.find((n) => n[prop] && n[prop][K.ITEM_ID] === t);
    };

    this.getGroupById = function (t) {
      return self.groupElements.find((n) => n[prop] && n[prop][K.GROUP_ID] === t);
    };

    this.initGroups = function () {
      self.groupElements = Array.from(self.parentElement.querySelectorAll(self.groupSelector));
      self.groupElements.forEach((t, n) => { self.initGroup(t, n); });
    };

    this.initGroup = function (t, n) {
      if (t[prop]) return;
      const s = t.closest(self.itemSelector);
      const parentItemId = s && s[prop] && s[prop][K.ITEM_ID];
      const isSingleGroup = t.hasAttribute(ACCORDION_CONSTANTS.ATTR.IS_SINGLE)
        ? t.getAttribute(ACCORDION_CONSTANTS.ATTR.IS_SINGLE) === "true"
        : self.isSingle;

      t[prop] = {};
      t[prop][K.PARENT_ITEM_ID] = parentItemId;
      t[prop][K.GROUP_ID] = String(n);
      t[prop][K.ITEMS_IDS] = [];
      t[prop][K.IS_SINGLE] = isSingleGroup;
      t.id = self.generateGroupId(n);

      const itemChildren = Array.from(t.children).filter((I) => I.matches(self.itemSelector));
      itemChildren.forEach((I, S) => {
        const itemId = `${n}-${S}`;
        self.initItem({ itemElement: I, itemId, groupId: n, parentItemId });
        t[prop][K.ITEMS_IDS].push(itemId);
      });
    };

    this.initItem = function ({ itemElement: n, itemId: s, groupId: l, parentItemId: m }) {
      if (n[prop]) return;
      const d = n.querySelector(self.summarySelector);
      const I = n.querySelector(self.detailsSelector);
      if (!d || !I) return;

      const summaryId = self.generateSummaryId(s);
      const detailsId = self.generateDetailsId(s);

      n.id = self.generateItemId(s);
      n[prop] = {};
      n[prop][K.ITEM_ID] = s;
      n[prop][K.PARENT_ITEM_ID] = m;
      n[prop][K.GROUP_ID] = String(l);
      n[prop][K.SUMMARY_ELEMENT] = d;
      n[prop][K.DETAILS_ELEMENT] = I;

      self.itemElements.push(n);

      d.setAttribute("id", summaryId);
      d.setAttribute("aria-controls", detailsId);
      d[prop] = {};
      d[prop][K.ITEM_ID] = s;

      I.setAttribute("id", detailsId);
      I.setAttribute("aria-labelledby", summaryId);
      I[prop] = {};
      I[prop][K.ITEM_ID] = s;

      if (m) I.addEventListener("transitionend", self.onDetailsTransitionEnd);
      d.addEventListener("click", self.onSummaryClick);
      self.itemResizeObserver.observe(n);
    };

    this.onSummaryClick = function (t) {
      if (self.breakpoint.matches && t.currentTarget && t.currentTarget[prop]) {
        const itemId = t.currentTarget[prop][K.ITEM_ID];
        self.toggle(itemId);
      }
    };

    this.onDetailsTransitionEnd = function (t) {
      if (t.target && t.target[prop]) {
        const item = self.getItemById(t.target[prop][K.ITEM_ID]);
        if (item && item[prop] && item[prop][K.PARENT_ITEM_ID]) {
          self.updateDetailsHeight(item[prop][K.PARENT_ITEM_ID]);
        }
      }
    };

    this.onBreakpointChange = function () {
      if (self.breakpoint.matches) {
        if (self.isDestroyed && self.destroyedBy === ACCORDION_CONSTANTS.MODE.BREAKPOINT) {
          self.init();
        }
      } else {
        if (!self.isDestroyed) {
          self.destroy(ACCORDION_CONSTANTS.MODE.BREAKPOINT);
        }
      }
    };

    this.itemResizeObserver = new ResizeObserver((entries) => {
      entries.forEach((n) => {
        const l = n.target;
        if (l[prop] && l[prop][K.IS_OPEN]) {
          const m = n.contentRect?.width || n.contentBoxSize[0].inlineSize;
          const d = l[prop][K.PREVIOUS_WIDTH];
          if (d !== m) {
            l[prop][K.PREVIOUS_WIDTH] = m;
            self.open(l);
          }
        }
      });
    });

    this.destroy = function (t = ACCORDION_CONSTANTS.MODE.MANUAL) {
      self.itemResizeObserver.disconnect();
      self.groupElements.forEach((n) => { self.destroyGroup(n); });
      self.isDestroyed = true;
      self.destroyedBy = t;
    };

    this.destroyGroup = function (t) {
      const n = typeof t === "string" ? self.getGroupById(t) : t;
      if (n && n[prop]) {
        const items = self.itemElements.filter((l) => l[prop] && l[prop][K.GROUP_ID] === n[prop][K.GROUP_ID]);
        items.forEach((l) => { self.destroyItem(l); });
        self.groupElements = self.groupElements.filter((l) => l[prop] && l[prop][K.GROUP_ID] !== n[prop][K.GROUP_ID]);
        delete n[prop];
        n.removeAttribute("id");
      }
    };

    this.destroyItem = function (t) {
      const n = typeof t === "string" ? self.getItemById(t) : t;
      if (n && n[prop]) {
        const s = n[prop][K.SUMMARY_ELEMENT];
        const l = n[prop][K.DETAILS_ELEMENT];
        self.itemElements = self.itemElements.filter((m) => m[prop] && m[prop][K.ITEM_ID] !== n[prop][K.ITEM_ID]);

        delete n[prop];
        n.removeAttribute("id");
        if (s) {
          delete s[prop];
          s.removeAttribute("id");
          s.removeAttribute("aria-controls");
          s.removeAttribute("aria-expanded");
          s.removeEventListener("click", self.onSummaryClick);
        }
        if (l) {
          delete l[prop];
          l.removeAttribute("id");
          l.removeAttribute("aria-labelledby");
          l.removeAttribute("inert");
          l.style.maxHeight = "";
          l.removeEventListener("transitionend", self.onDetailsTransitionEnd);
        }
      }
    };

    this.updateDetailsHeight = function (t, n = 0) {
      const s = typeof t === "string" ? self.getItemById(t) : t;
      if (s && s[prop] && s[prop][K.IS_OPEN]) {
        const l = s[prop][K.DETAILS_ELEMENT];
        const m = l.scrollHeight + n;
        l.style.maxHeight = `${m}px`;
        const d = s[prop][K.PARENT_ITEM_ID];
        if (d) self.updateDetailsHeight(d, m);
      }
    };

    this.close = function (t) {
      const n = typeof t === "string" ? self.getItemById(t) : t;
      if (!n || !n[prop]) return;
      const s = n[prop][K.DETAILS_ELEMENT];
      const l = n[prop][K.SUMMARY_ELEMENT];
      if (s && l) {
        n[prop][K.IS_OPEN] = false;
        n.classList.remove(self.openClass);
        l.setAttribute("aria-expanded", "false");
        s.setAttribute("inert", "");
        s.style.maxHeight = "0";
      }
    };

    this.open = function (e) {
      const c = typeof e === "string" ? self.getItemById(e) : e;
      if (!c || !c[prop]) return;
      const y = self.getGroupById(c[prop][K.GROUP_ID]);
      const h = c[prop][K.DETAILS_ELEMENT];
      const p = c[prop][K.SUMMARY_ELEMENT];
      if (y && y[prop] && y[prop][K.IS_SINGLE]) {
        self.closeGroup(y);
      }
      c[prop][K.IS_OPEN] = true;
      c.classList.add(self.openClass);
      p.setAttribute("aria-expanded", "true");
      h.removeAttribute("inert");
      self.updateDetailsHeight(c);
    };

    this.toggle = function (t) {
      const n = typeof t === "string" ? self.getItemById(t) : t;
      if (n && n[prop] && n[prop][K.IS_OPEN]) {
        self.close(n);
      } else {
        self.open(n);
      }
    };

    this.closeGroup = function (t) {
      const n = typeof t === "string" ? self.getGroupById(t) : t;
      if (n && n[prop]) {
        const s = n[prop][K.ITEMS_IDS];
        s.forEach((l) => { self.close(l); });
      }
    };

    this.closeAll = function () {
      self.groupElements.forEach((t) => { self.closeGroup(t); });
    };
  }

  Accordion.prototype.init = function () {
    this.updateInstanceId();
    this.initGroups();
    this.isDestroyed = false;
    this.destroyedBy = undefined;
    this.breakpoint.addEventListener("change", this.onBreakpointChange);
    this.onBreakpointChange();
    this.closeAll();
  };

  Accordion.generateInstanceId = function () {
    let r = "";
    const a = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789";
    for (let e = 0; e < 4; e += 1) {
      r += a.charAt(Math.floor(Math.random() * a.length));
    }
    return Accordion.isInstanceIdUnique(r) ? r : Accordion.generateInstanceId();
  };

  Accordion.isInstanceIdUnique = function (r) {
    return !document.querySelector(`[id^="accordion-group-${r}"]`);
  };

  const footerGroupSelector = '[data-component-id="footer"] [data-role="accordion-group"]';
  if (document.querySelector(footerGroupSelector)) {
    const accordion = new Accordion({
      groupSelector: footerGroupSelector,
      breakpoint: window.matchMedia("(max-width: 1280px)")
    });
    accordion.init();
  }
};
</script>
